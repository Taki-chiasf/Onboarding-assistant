name: onboarding-assistant

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: onboarding_assistant
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d onboarding_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  api:
    build:
      context: ./backend
    environment:
      MOCK_OIDC: ${MOCK_OIDC:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret}
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      DEV_PRINCIPAL_SUB: ${DEV_PRINCIPAL_SUB:-dev-user}
      DEV_PRINCIPAL_EMAIL: ${DEV_PRINCIPAL_EMAIL:-dev@example.com}
      DEV_PRINCIPAL_DEPT: ${DEV_PRINCIPAL_DEPT:-Engineering}
      DEV_PRINCIPAL_ROLE: ${DEV_PRINCIPAL_ROLE:-employee}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ingest-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      REDIS_URL: redis://redis:6379/0
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  db-seed:
    build:
      context: ./backend
    entrypoint: ["python", "-m", "scripts.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  pgbouncer:
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd # PgBouncer 1.25.2
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: onboarding_assistant
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:5432"
    depends_on:
      db:
        condition: service_healthy

  db-ingest:
    build:
      context: ./backend
    profiles: ["ingest"]
    entrypoint: ["python", "-m", "app.ingest.cli"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  eval:
    build:
      context: ./backend
    profiles: ["eval"]
    entrypoint: ["python", "-m", "app.eval.eval_run"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    profiles: ["observability"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki.yaml"]
    profiles: ["observability"]
    volumes:
      - ./infra/loki.yaml:/etc/loki.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

volumes:
  db-data:
  redis-data:
