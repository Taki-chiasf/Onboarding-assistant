name: onboarding-assistant

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: onboarding_assistant
    ports:
      # Stateful services bind to loopback only: the containers talk over the
      # compose network, so a host port is for local psql/redis-cli or tests,
      # never for the LAN or the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d onboarding_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # A token password even on the internal network: with loopback host
    # binding plus a password, a stray port publish or container escape does
    # not hand out an unauthenticated queue that can write chat history.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-demo-token}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-demo-token}

  otel-collector:
    image: otel/opentelemetry-collector:0.159.0
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

  api:
    build:
      context: ./backend
    environment:
      MOCK_OIDC: ${MOCK_OIDC:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret}
      # Real OIDC (production auth path). Blank keeps the demo persona picker.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_DEPT_CLAIM: ${OIDC_DEPT_CLAIM:-dept}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-role}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_ALLOWED_DEPARTMENTS: ${OIDC_ALLOWED_DEPARTMENTS:-}
      OIDC_ALLOWED_ROLES: ${OIDC_ALLOWED_ROLES:-employee,admin}
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-demo-token}@redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      DEV_PRINCIPAL_SUB: ${DEV_PRINCIPAL_SUB:-dev-user}
      DEV_PRINCIPAL_EMAIL: ${DEV_PRINCIPAL_EMAIL:-dev@example.com}
      DEV_PRINCIPAL_DEPT: ${DEV_PRINCIPAL_DEPT:-Engineering}
      DEV_PRINCIPAL_ROLE: ${DEV_PRINCIPAL_ROLE:-employee}
      DAILY_TOKEN_BUDGET: ${DAILY_TOKEN_BUDGET:-200000}
      DAILY_COST_ALERT_USD: ${DAILY_COST_ALERT_USD:-1.0}
      MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_BRANCH: ${WEBHOOK_BRANCH:-main}
      TEMPO_URL: ${TEMPO_URL:-http://tempo:3200}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ingest-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-demo-token}@redis:6379/0
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  db-seed:
    build:
      context: ./backend
    entrypoint: ["python", "-m", "scripts.seed"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  pgbouncer:
    image: edoburu/pgbouncer@sha256:4c1ca296ef525f108f5d3552cc337c0c09587cf8dae7f0067fd93349e47dc1cd # PgBouncer 1.25.2
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: onboarding_assistant
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      db:
        condition: service_healthy

  db-ingest:
    build:
      context: ./backend
    profiles: ["ingest"]
    entrypoint: ["python", "-m", "app.ingest.cli"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  eval:
    build:
      context: ./backend
    profiles: ["eval"]
    entrypoint: ["python", "-m", "app.eval.eval_run"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Nightly loop: replay the eval set, record per-case runs, compare to the
  # last green night, and alert the webhook when configured. Scheduling is
  # external (a cron entry or a platform scheduled machine); running the
  # service executes the loop once and exits 0 when green.
  eval-nightly:
    build:
      context: .
      dockerfile: eval-runner/Dockerfile
    profiles: ["eval"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/onboarding_assistant
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      SLACK_EVAL_WEBHOOK_URL: ${SLACK_EVAL_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    profiles: ["observability"]
    volumes:
      - ./infra/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200"

  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki.yaml"]
    profiles: ["observability"]
    volumes:
      - ./infra/loki.yaml:/etc/loki.yaml:ro
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    environment:
      # The dashboards are visible after signing in with the credentials below.
      # Anonymous access is off: an open demo dashboard that can browse every
      # trace (emails, query text) should not sit behind zero auth.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-sharing}
    # Bound to loopback like the stateful stores; expose it only through a
    # tunneling proxy if it must be reachable remotely.
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

volumes:
  db-data:
  redis-data:
