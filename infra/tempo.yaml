server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks

compactor:
  compaction:
    # Keep a day of traces so the console's span viewer can resolve recent
    # turns without growing the local blocks directory unbounded.
    block_retention: 24h
