name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: onboarding_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/onboarding_assistant
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: PII scan
        working-directory: backend
        run: uv run python -m scripts.pii_scan

      - name: Typecheck
        working-directory: backend
        run: uv run mypy .

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Test
        working-directory: backend
        run: uv run pytest --cov=app --cov-fail-under=80

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: onboarding-assistant-api:ci

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ingest-worker/Dockerfile
          push: false
          load: true
          tags: onboarding-assistant-worker:ci

      - name: Build eval-runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: eval-runner/Dockerfile
          push: false
          load: true
          tags: onboarding-assistant-eval-runner:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: true
          tags: onboarding-assistant-web:ci
